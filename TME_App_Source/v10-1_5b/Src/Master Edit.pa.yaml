            PaddingTop: =(5)*((App.Height/1136))
            Size: =(21)*(Min(App.Width/640,App.Height/1136))
            Text: ="Бараан"
            Visible: =((Lower(User().Email)="od.u@tme.mn" || (pgAccess.Active && (IsBlank(pgAccess.ExpiresAt) || pgAccess.ExpiresAt>Now()) && "|edit|" in pgAccess.Title && !IsBlank(pgAccess.LocationCode)))) && (true)
            Width: =(196)*((App.Width/640))
