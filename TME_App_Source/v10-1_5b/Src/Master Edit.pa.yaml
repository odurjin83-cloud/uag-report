            Width: =(100)*((App.Width/640))
            X: =(21)*((App.Width/640))
            Y: =(24)*((App.Height/1136))
      - Label33:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(131, 24, 75, 1)
            BorderThickness: =(0)*(Min(App.Width/640,App.Height/1136))
            FocusedBorderThickness: =(0)*(Min(App.Width/640,App.Height/1136))
            Font: =Font.'Open Sans'
