                                  itemNo: Text(r.Value.itemNo),
                                  locationCode: Text(r.Value.locationCode),
                                  quantity: Value(r.Value.quantity)
                              }
                          )
                      );
              
                      Set(
                          varStockBatchNo,
                          varStockBatchNo + 1
                      );
              
                      // ==========================================
                      // 4. DATA БАЙВАЛ UPDATE
                      // ==========================================
              
                      If(
                          CountRows(colStockEntries) > 0,
              
                          // --------------------------------------
                          // ITEM + LOCATION-ООР НЭГТГЭХ
                          // --------------------------------------
              
                          ClearCollect(
                              colStockDelta,
                              AddColumns(
                                  GroupBy(
                                      colStockEntries,
                                      itemNo,
                                      locationCode,
                                      StockRows
                                  ),
                                  DeltaQty,
                                  Sum(
                                      StockRows,
                                      quantity
                                  )
                              )
                          );
              
                          // ======================================
                          // 4A. LOCAL STOCK UPDATE
                          // ======================================
              
                          ForAll(
                              colStockDelta As d,
              
                              With(
                                  {
                                      existingStock:
                                          LookUp(
                                              colOfflineStock,
                                              itemNo = d.itemNo &&
                                              locationCode = d.locationCode
                                          )
                                  },
              
                                  If(
                                      IsBlank(existingStock),
              
                                      Collect(
                                          colOfflineStock,
                                          {
                                              itemNo: d.itemNo,
                                              locationCode: d.locationCode,
                                              quantity: d.DeltaQty
                                          }
                                      ),
              
                                      Patch(
                                          colOfflineStock,
                                          existingStock,
                                          {
                                              quantity:
                                                  existingStock.quantity +
                                                  d.DeltaQty
                                          }
                                      )
                                  )
                              )
                          );
              
                          // ======================================
                          // 4B. BC CHECK SNAPSHOT UPDATE
                          // ======================================
              
                          ForAll(
                              colStockDelta As d,
              
                              With(
                                  {
                                      existingCheck:
                                          LookUp(
                                              colBCStockCheck,
                                              itemNo = d.itemNo &&
                                              locationCode = d.locationCode
                                          )
                                  },
              
                                  If(
                                      IsBlank(existingCheck),
              
                                      Collect(
                                          colBCStockCheck,
                                          {
                                              itemNo: d.itemNo,
                                              locationCode: d.locationCode,
                                              quantity: d.DeltaQty
                                          }
                                      ),
              
                                      Patch(
                                          colBCStockCheck,
                                          existingCheck,
                                          {
                                              quantity:
                                                  existingCheck.quantity +
                                                  d.DeltaQty
                                          }
                                      )
                                  )
                              )
                          );
              
                          // ======================================
                          // LAST ENTRY UPDATE
                          // ======================================
              
                          ClearCollect(
                              colStockSyncInfo,
                              {
                                  LastEntryNo:
                                      Max(
                                          colStockEntries,
                                          entryNo
                                      )
                              }
                          );
              
                          // ======================================
                          // SAVE LOCAL
                          // ======================================
              
                          SaveData(
                              colOfflineStock,
                              "OfflineStock"
                          );
              
                          SaveData(
                              colBCStockCheck,
                              "BCStockCheck"
                          );
              
                          SaveData(
                              colStockSyncInfo,
                              "StockSyncInfo"
                          )
                      );
              
                      // ==========================================
                      // 5. LAST BATCH
                      // ==========================================
              
                      If(
                          CountRows(colStockEntries) < 1000,
              
                          Set(
                              varStockAutoSync,
                              false
                          );
              
                          Notify(
                              "Stock sync дууслаа | Last Entry: " &
                              Text(
                                  Coalesce(
                                      First(colStockSyncInfo).LastEntryNo,
                                      varLastStockEntryNo
                                  ),
                                  "#,##0"
                              ) &
                              " | Stock мөр: " &
                              Text(
                                  CountRows(colOfflineStock),
                                  "#,##0"
                              ) &
                              " | Check мөр: " &
                              Text(
                                  CountRows(colBCStockCheck),
                                  "#,##0"
                              ),
                              NotificationType.Success
                          )
                      )
                  )
              )
              )
