            HoverFill: =ColorFade(RGBA(211, 66, 9, 1), -20%)
            OnTimerEnd: |-
              =If((Lower(User().Email)="od.u@tme.mn" || (pgAccess.Active && (IsBlank(pgAccess.ExpiresAt) || pgAccess.ExpiresAt>Now()) && "|sync|" in pgAccess.Title && !IsBlank(pgAccess.LocationCode))),If(
                  varStockAutoSync,
              
                  If(
                      !Connection.Connected,
              
                      Set(varStockAutoSync, false);
              
                      Notify(
                          "Интернет тасарлаа. Stock sync зогслоо. Өмнөх хадгалсан batch-ууд хэвээр.",
                          NotificationType.Warning
                      ),
              
                      // ==========================================
                      // 1. CURRENT LAST ENTRY
                      // ==========================================
              
                      Set(
                          varLastStockEntryNo,
                          Coalesce(
                              First(colStockSyncInfo).LastEntryNo,
                              0
                          )
                      );
              
                      // ==========================================
                      // 2. RESET BATCH STATUS
                      // ==========================================
              
                      Set(varStockBatchOK, false);
                      Set(varStockResponse, Blank());
              
                      // ==========================================
                      // 3. GET NEXT BATCH SAFELY
                      // ==========================================
              
                      IfError(
                          Set(
                              varStockResponse,
                              PA_GetAllStockOffline.Run(
                                  varLastStockEntryNo
                              )
                          );
              
                          Set(varStockBatchOK, true),
              
                          Set(varStockBatchOK, false);
                          Set(varStockAutoSync, false);
              
                          Notify(
                              "Stock batch татах үед алдаа гарлаа. Энэ batch local stock-д нэмэгдээгүй.",
                              NotificationType.Error
                          )
                      );
              
                      // ==========================================
                      // 4. ONLY PROCESS SUCCESSFUL RESPONSE
                      // ==========================================
              
                      If(
                          varStockBatchOK,
              
                          ClearCollect(
                              colStockEntries,
                              ForAll(
                                  Table(
                                      ParseJSON(
                                          Coalesce(
                                              varStockResponse.stockjson,
                                              "[]"
                                          )
                                      )
                                  ) As r,
                                  {
                                      entryNo: Value(r.Value.entryNo),
                                      itemNo: Text(r.Value.itemNo),
                                      locationCode: Text(r.Value.locationCode),
                                      quantity: Value(r.Value.quantity)
                                  }
                              )
                          );
              
                          Set(
                              varStockBatchNo,
                              varStockBatchNo + 1
                          );
              
                          // ======================================
                          // 5. DATA RECEIVED
                          // ======================================
              
                          If(
                              CountRows(colStockEntries) > 0,
              
                              // ----------------------------------
                              // GROUP ITEM + LOCATION
                              // ----------------------------------
              
                              ClearCollect(
                                  colStockDelta,
                                  AddColumns(
                                      GroupBy(
                                          colStockEntries,
                                          itemNo,
                                          locationCode,
                                          StockRows
                                      ),
                                      DeltaQty,
                                      Sum(
                                          StockRows,
                                          quantity
                                      )
                                  )
                              );
              
                              // ----------------------------------
                              // LOCAL STOCK UPDATE
                              // ----------------------------------
              
                              ForAll(
                                  colStockDelta As d,
              
                                  With(
                                      {
                                          existingStock:
                                              LookUp(
                                                  colOfflineStock,
                                                  itemNo = d.itemNo &&
                                                  locationCode = d.locationCode
                                              )
                                      },
              
                                      If(
                                          IsBlank(existingStock),
              
                                          Collect(
                                              colOfflineStock,
                                              {
                                                  itemNo: d.itemNo,
                                                  locationCode: d.locationCode,
                                                  quantity: d.DeltaQty
                                              }
                                          ),
              
                                          Patch(
                                              colOfflineStock,
                                              existingStock,
                                              {
                                                  quantity:
                                                      existingStock.quantity +
                                                      d.DeltaQty
                                              }
                                          )
                                      )
                                  )
                              );
              
                              // ==================================
                              // 6. UPDATE LAST ENTRY
                              // ==================================
              
                              ClearCollect(
                                  colStockSyncInfo,
                                  {
                                      LastEntryNo:
                                          Max(
                                              colStockEntries,
                                              entryNo
                                          )
                                  }
                              );
              
                              // ==================================
                              // 7. SAVE EVERY SUCCESSFUL BATCH
                              // ==================================
              
                              SaveData(
                                  colOfflineStock,
                                  "OfflineStock"
                              );
              
                              SaveData(
                                  colStockSyncInfo,
                                  "StockSyncInfo"
                              )
                          );
              
                          // ======================================
                          // 8. LAST BATCH
                          // ======================================
              
                          If(
                              CountRows(colStockEntries) < 1000,
              
                              Set(
                                  varStockAutoSync,
                                  false
                              );
              
                              Notify(
                                  "Stock sync дууслаа | Last Entry: " &
                                  Text(
                                      Coalesce(
                                          First(colStockSyncInfo).LastEntryNo,
                                          varLastStockEntryNo
                                      ),
                                      "#,##0"
                                  ) &
                                  " | Stock мөр: " &
                                  Text(
                                      CountRows(colOfflineStock),
                                      "#,##0"
                                  ),
                                  NotificationType.Success
                              )
                          )
                      )
                  )
              )
              )
