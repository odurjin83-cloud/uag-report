<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TME & Бөөрөлжүүт — Тооллогын Систем (PWA)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-dashed: #cbd5e1;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 84px;
    }

    /* Header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .brand { font-weight: 700; font-size: 15px; line-height: 1.2; }
    .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: #f1f5f9;
      cursor: pointer;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .dot.offline { background: var(--warning); }

    /* Container */
    .container { max-width: 760px; margin: 0 auto; padding: 14px; }

    /* Role & Scope Bar */
    .role-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    select, input {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 14px;
      padding-bottom: 2px;
    }
    .tab-btn {
      flex: 1;
      min-width: 105px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .hidden { display: none !important; }

    /* Search & Scanner */
    .search-box {
      position: relative;
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-input-wrap { position: relative; flex: 1; }
    .search-input-wrap input { padding-right: 34px; font-size: 15px; }
    .clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #e2e8f0;
      color: var(--text);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 13px;
      cursor: pointer;
    }
    .qr-btn {
      padding: 0 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Item List Cards */
    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .item-card.selected { border: 2px solid var(--accent); }
    .thumb {
      width: 64px;
      height: 64px;
      border-radius: 8px;
      object-fit: cover;
      background: #f1f5f9;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-code { font-size: 12px; font-weight: 700; color: var(--accent); }
    .item-name {
      font-size: 14px;
      font-weight: 600;
      margin: 2px 0 6px;
      line-height: 1.35;
      word-break: break-word;
    }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); }
    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: #f1f5f9;
      color: var(--text);
    }
    .badge.zero { background: #fef3c7; color: #92400e; }
    .badge.counted { background: #d1fae5; color: #065f46; }

    /* Count Drawer / Panel */
    .count-panel {
      background: var(--surface);
      border: 1.5px dashed var(--border-dashed);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }
    .preview-lg {
      width: 84px;
      height: 84px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #f1f5f9;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .stat-mini {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .stat-mini span { display: block; font-size: 11px; color: var(--muted); }
    .stat-mini strong { font-size: 15px; }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-secondary {
      padding: 8px 12px;
      background: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Executive Report KPIs */
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .kpi-card.dashed { border-style: dashed; }
    .kpi-title { font-size: 12px; color: var(--muted); font-weight: 600; }
    .kpi-val { font-size: 20px; font-weight: 800; margin: 4px 0; }
    .kpi-sub { font-size: 11px; color: var(--muted); }

    /* Bar Chart (Pure CSS) */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 14px;
    }
    .chart-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .bar-row { margin-bottom: 10px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .bar-track { height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s; }

    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
      margin-bottom: 14px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; font-size: 11px; text-transform: uppercase; color: var(--muted); }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .pos { color: var(--success); font-weight: 700; }
    .neg { color: var(--danger); font-weight: 700; }

    /* Non-blocking Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: #fff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      max-width: 92vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    TME & Бөөрөлжүүт Тооллого
    <small id="userScopeLabel">Хэрэглэгч: Ү.Од • Эрх: Бараа + Хөрөнгө</small>
  </div>
  <button class="status-pill" id="networkToggle" title="Офлайн/Онлайн горим сэлгэх">
    <span class="dot" id="netDot"></span>
    <span id="netText">Онлайн • Синк: 0</span>
  </button>
</header>

<main class="container">
  <!-- Эрх ба Байршлын симуляц (Бодит үед Microsoft Entra ID token-оос ирнэ) -->
  <section class="role-bar">
    <div class="field">
      <label>Хэрэглэгчийн эрх (RBAC)</label>
      <select id="roleSelect">
        <option value="BOTH_EXEC">CEO / CFO (Бараа + Хөрөнгө)</option>
        <option value="BOTH_CLERK">Нярав (Бараа + Хөрөнгө тоолох)</option>
        <option value="INV_ONLY">Нярав (Зөвхөн Бараа материал)</option>
        <option value="FA_ONLY">Нярав (Зөвхөн Үндсэн хөрөнгө)</option>
      </select>
    </div>
    <div class="field">
      <label>Хамрах бүс / Агуулах</label>
      <select id="siteSelect">
        <option value="ALL">Бүх бүс (Mining, Power, CAMP, UB)</option>
        <option value="Power">Power — Бөөрөлжүүт ЦС</option>
        <option value="Mining">Mining — Уурхайн агуулах</option>
        <option value="CAMP">CAMP — Кемпийн агуулах</option>
        <option value="UB">UB — Төв оффис</option>
      </select>
    </div>
  </section>

  <!-- Модуль ба Тайлангийн цэс -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="inventory" id="tabInv">📦 Бараа материал</button>
    <button class="tab-btn" data-tab="assets" id="tabFa">🏭 Үндсэн хөрөнгө</button>
    <button class="tab-btn" data-tab="exec" id="tabExec">📊 CEO / CFO Тайлан</button>
  </nav>

  <!-- 1 & 2. ТООЛЛОГЫН ХЭСЭГ (БАРАА БА ХӨРӨНГӨ) -->
  <section id="countSection">
    <div class="search-box">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="Код, нэр, серийн дугаараар хайх..." autocomplete="off" />
        <button class="clear-btn hidden" id="clearSearchBtn" aria-label="Арилгах">×</button>
      </div>
      <button class="qr-btn" id="qrSimBtn">📷 QR Унших</button>
    </div>

    <!-- Сонгогдсон бараа/хөрөнгийг тоолох хэсэг -->
    <div class="count-panel hidden" id="countPanel">
      <div class="panel-header">
        <div>
          <div class="item-code" id="selCode">ITEM-001</div>
          <div class="item-name" id="selName">Нэр</div>
          <div class="meta-row" id="selMeta"></div>
        </div>
        <img id="selImg" class="preview-lg" alt="Зураг" />
      </div>

      <div class="grid-2">
        <div class="stat-mini">
          <span>BC Эхний үлдэгдэл</span>
          <strong id="selOpening">0</strong>
        </div>
        <div class="stat-mini">
          <span>BC Хөдөлгөөн (тоолох хүртэл)</span>
          <strong id="selMovement">0</strong>
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Бодит тоолсон тоо</label>
          <input type="number" id="countedQtyInput" min="0" step="1" placeholder="Тоо оруулах..." />
        </div>
        <div class="field">
          <label>Зураг нэмэх / шинэчлэх</label>
          <input type="file" id="photoInput" accept="image/*" capture="environment" />
        </div>
      </div>

      <div style="display:flex; gap:8px;">
        <button class="btn-primary" id="saveCountBtn" style="flex:2;">Хадгалах & Дараагийнх</button>
        <button class="btn-secondary" id="deselectBtn" style="flex:1;">Болих</button>
      </div>
    </div>

    <!-- Жагсаалт -->
    <div id="itemsList"></div>
  </section>

  <!-- 3. CEO / CFO НЭГДСЭН ТАЙЛАН -->
  <section id="execSection" class="hidden">
    <div class="role-bar" style="margin-bottom:12px;">
      <div class="field">
        <label>Тайлангийн төрөл</label>
        <select id="reportModuleFilter">
          <option value="ALL">Нийт (Бараа + Хөрөнгө)</option>
          <option value="INV">Зөвхөн Бараа материал</option>
          <option value="FA">Зөвхөн Үндсэн хөрөнгө</option>
        </select>
      </div>
      <div class="field">
        <label>Тайлангийн огноо</label>
        <input type="date" id="reportDate" value="2026-11-28" />
      </div>
    </div>

    <div class="kpi-grid" id="kpiGrid"></div>

    <div class="chart-card">
      <div class="chart-title">Бүсээрх тооллогын ахиц (Mining, Power, CAMP, UB)</div>
      <div id="siteChart"></div>
    </div>

    <div class="chart-card">
      <div class="chart-title">Өдрийн тооллогын тренд (Сүүлийн 5 өдөр)</div>
      <div id="trendChart"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Код / Нэр</th>
            <th>Бүс</th>
            <th class="num">Хүлээгдэж буй</th>
            <th class="num">Тоолсон</th>
            <th class="num">Зөрүү</th>
            <th class="num">Дүн (₮)</th>
          </tr>
        </thead>
        <tbody id="varianceTableBody"></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  // Placeholder SVG зураг (BC-ээс зураг ирээгүй үед)
  const PLACEHOLDER_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
      <rect width="120" height="120" fill="#f1f5f9"/>
      <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="12">Зураггүй</text>
    </svg>`
  );

  // Жишээ BC өгөгдөл (Бараа + Хөрөнгө)
  const INITIAL_CATALOG = [
    { id: "INV-1001", type: "INV", site: "Power", bin: "A-01", name: "Турбины өндөр даралтын холхивч SKF-22318", opening: 12, movement: -2, unitCost: 850000, costVerified: true, img: "" },
    { id: "INV-1002", type: "INV", site: "Power", bin: "B-04", name: "Трансформаторын тусгаарлагч тос (200л торх)", opening: 5, movement: 1, unitCost: 1450000, costVerified: true, img: "" },
    { id: "INV-1003", type: "INV", site: "Mining", bin: "M-12", name: "Экскаваторын гидравлик шүүлтүүр CAT-1R0777", opening: 0, movement: 0, unitCost: 120000, costVerified: true, img: "" },
    { id: "INV-1004", type: "INV", site: "CAMP", bin: "C-02", name: "Өвлийн дулаан ажлын хувцас (XL)", opening: 30, movement: -5, unitCost: null, costVerified: false, img: "" },
    { id: "FA-2001", type: "FA", site: "Power", bin: "Блок-1", name: "Зуухны тэжээлийн насос Grundfos CR-95", opening: 1, movement: 0, unitCost: 18500000, costVerified: true, img: "" },
    { id: "FA-2002", type: "FA", site: "UB", bin: "IT-Өрөө", name: "Dell PowerEdge R750 Сервер (Үндсэн)", opening: 1, movement: 0, unitCost: 24000000, costVerified: true, img: "" },
    { id: "FA-2003", type: "FA", site: "Mining", bin: "Талбай-2", name: "Зөөврийн дизель генератор 150кВА", opening: 1, movement: 0, unitCost: null, costVerified: false, img: "" }
  ];

  // Төлөв (LocalStorage-оор офлайн хадгална)
  let state = JSON.parse(localStorage.getItem("tme_pwa_state") || "null") || {
    online: true,
    activeTab: "inventory",
    role: "BOTH_EXEC",
    site: "ALL",
    selectedId: null,
    // Дахин тоолсон барааг давхар нэмэхгүйн тулд item.id-ээр түлхүүрлэнэ (Upsert)
    counts: {},
    syncQueue: [],
    auditLog: []
  };

  function persist() {
    localStorage.setItem("tme_pwa_state", JSON.stringify(state));
    updateHeaderStatus();
  }

  function showToast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2400);
  }

  function updateHeaderStatus() {
    const dot = document.getElementById("netDot");
    const txt = document.getElementById("netText");
    dot.className = state.online ? "dot" : "dot offline";
    txt.textContent = state.online
      ? `Онлайн • Синк: ${state.syncQueue.length}`
      : `Офлайн • Дараалал: ${state.syncQueue.length}`;
  }

  // Эрхийн шүүлт
  function getAllowedModules() {
    if (state.role === "INV_ONLY") return ["INV"];
    if (state.role === "FA_ONLY") return ["FA"];
    return ["INV", "FA"];
  }

  function applyRolePermissions() {
    const allowed = getAllowedModules();
    const tabInv = document.getElementById("tabInv");
    const tabFa = document.getElementById("tabFa");
    const tabExec = document.getElementById("tabExec");

    tabInv.classList.toggle("hidden", !allowed.includes("INV"));
    tabFa.classList.toggle("hidden", !allowed.includes("FA"));
    tabExec.classList.toggle("hidden", state.role !== "BOTH_EXEC");

    if (state.activeTab === "inventory" && !allowed.includes("INV")) state.activeTab = "assets";
    if (state.activeTab === "assets" && !allowed.includes("FA")) state.activeTab = "inventory";
    if (state.activeTab === "exec" && state.role !== "BOTH_EXEC") {
      state.activeTab = allowed.includes("INV") ? "inventory" : "assets";
    }

    document.querySelectorAll(".tab-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.tab === state.activeTab);
    });

    const isExec = state.activeTab === "exec";
    document.getElementById("countSection").classList.toggle("hidden", isExec);
    document.getElementById("execSection").classList.toggle("hidden", !isExec);

    document.getElementById("userScopeLabel").textContent =
      `Хэрэглэгч: Ү.Од • Модуль: ${allowed.join(" + ")} • Бүс: ${state.site}`;
  }

  // Жагсаалт зурах
  function renderItems() {
    const listEl = document.getElementById("itemsList");
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    document.getElementById("clearSearchBtn").classList.toggle("hidden", q.length === 0);

    const moduleType = state.activeTab === "assets" ? "FA" : "INV";
    const filtered = INITIAL_CATALOG.filter(item => {
      if (item.type !== moduleType) return false;
      if (state.site !== "ALL" && item.site !== state.site) return false;
      if (q && !(item.id.toLowerCase().includes(q) || item.name.toLowerCase().includes(q) || item.bin.toLowerCase().includes(q))) {
        return false;
      }
      return true;
    });

    listEl.innerHTML = filtered.map(item => {
      const rec = state.counts[item.id];
      const expected = item.opening + item.movement;
      const imgSrc = (rec && rec.photoDataUrl) || item.img || PLACEHOLDER_IMG;
      return `
        <div class="item-card ${state.selectedId === item.id ? "selected" : ""}" onclick="selectItem('${item.id}')">
          <img src="${imgSrc}" class="thumb" alt="${item.id}" />
          <div class="item-info">
            <div class="item-code">${item.id} • ${item.site} (${item.bin})</div>
            <div class="item-name">${item.name}</div>
            <div class="meta-row">
              <span class="badge ${expected === 0 ? "zero" : ""}">BC хүлээгдэж буй: ${expected}</span>
              ${rec ? `<span class="badge counted">Тоолсон: ${rec.qty}</span>` : `<span class="badge">Тоолоогүй</span>`}
            </div>
          </div>
        </div>
      `;
    }).join("") || `<div style="text-align:center;color:var(--muted);padding:24px;">Тохирох бүртгэл олдсонгүй.</div>`;
  }

  // Бараа / Хөрөнгө сонгох
  window.selectItem = function(id) {
    const item = INITIAL_CATALOG.find(x => x.id === id);
    if (!item) return;
    state.selectedId = id;
    const rec = state.counts[id];

    document.getElementById("countPanel").classList.remove("hidden");
    document.getElementById("selCode").textContent = `${item.id} • ${item.site} (${item.bin})`;
    document.getElementById("selName").textContent = item.name;
    document.getElementById("selMeta").innerHTML = `<span class="badge">${item.type === "INV" ? "Бараа материал" : "Үндсэн хөрөнгө"}</span>`;
    document.getElementById("selOpening").textContent = item.opening;
    document.getElementById("selMovement").textContent = (item.movement >= 0 ? "+" : "") + item.movement;
    document.getElementById("selImg").src = (rec && rec.photoDataUrl) || item.img || PLACEHOLDER_IMG;
    document.getElementById("countedQtyInput").value = rec ? rec.qty : "";
    document.getElementById("photoInput").value = "";
    document.getElementById("countedQtyInput").focus();
    renderItems();
  };

  function clearSelection() {
    state.selectedId = null;
    document.getElementById("countPanel").classList.add("hidden");
    renderItems();
  }

  // Зураг шахаж унших (Хурдан синк хийх зорилгоор)
  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = 800;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.75));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // Хадгалах (Дахин тоолсон ч тайланд давхар өсгөхгүй — Upsert + Idempotent Event ID)
  document.getElementById("saveCountBtn").addEventListener("click", async () => {
    const id = state.selectedId;
    if (!id) return;
    const rawVal = document.getElementById("countedQtyInput").value;
    if (rawVal === "" || Number(rawVal) < 0) {
      showToast("Тоолсон тоог зөв оруулна уу.");
      return;
    }

    const qty = Number(rawVal);
    const fileInput = document.getElementById("photoInput");
    let photoDataUrl = state.counts[id]?.photoDataUrl || null;
    if (fileInput.files && fileInput.files[0]) {
      photoDataUrl = await compressImage(fileInput.files[0]);
    }

    const eventId = crypto.randomUUID ? crypto.randomUUID() : "evt_" + Date.now();
    const timestamp = new Date().toISOString();

    // Upsert: Нэг барааг дахин тоолсон бол сүүлийн утгаар шинэчилнэ (давхар нэмэхгүй)
    state.counts[id] = {
      itemId: id,
      qty,
      photoDataUrl,
      countedAt: timestamp,
      countedBy: "Ү.Од",
      lastEventId: eventId
    };

    state.auditLog.push({ eventId, itemId: id, qty, timestamp, user: "Ү.Од" });

    if (!state.online) {
      state.syncQueue.push({ eventId, itemId: id, qty, timestamp });
      showToast(`Офлайн хадгаллаа (Дараалал: ${state.syncQueue.length})`);
    } else {
      showToast(`${id} хадгалагдлаа — дараагийн бараагаа хайна уу`);
    }

    clearSelection();
    document.getElementById("searchInput").value = "";
    document.getElementById("searchInput").focus();
    persist();
    renderItems();
    renderExecReport();
  });

  // CEO / CFO Нэгдсэн тайлан зурах
  function renderExecReport() {
    const modFilter = document.getElementById("reportModuleFilter").value;
    const items = INITIAL_CATALOG.filter(item => {
      if (modFilter !== "ALL" && item.type !== modFilter) return false;
      if (state.site !== "ALL" && item.site !== state.site) return false;
      return true;
    });

    const totalItems = items.length;
    const countedItems = items.filter(i => state.counts[i.id] !== undefined).length;
    const pct = totalItems ? Math.round((countedItems / totalItems) * 100) : 0;

    let surplusQty = 0, shortageQty = 0, verifiedAmount = 0, unverifiedCount = 0;

    const rowsHtml = items.map(item => {
      const expected = item.opening + item.movement;
      const rec = state.counts[item.id];
      const actual = rec ? rec.qty : null;
      const diff = actual !== null ? actual - expected : 0;

      if (actual !== null) {
        if (diff > 0) surplusQty += diff;
        if (diff < 0) shortageQty += Math.abs(diff);
        if (item.costVerified && item.unitCost !== null) {
          verifiedAmount += actual * item.unitCost;
        } else {
          unverifiedCount++;
        }
      }

      const amountText = !item.costVerified || item.unitCost === null
        ? "Өртөг баталгаажаагүй"
        : actual !== null ? (actual * item.unitCost).toLocaleString("mn-MN") + " ₮" : "—";

      return `
        <tr>
          <td><strong>${item.id}</strong><br><span style="color:var(--muted);font-size:12px;">${item.name}</span></td>
          <td>${item.site}</td>
          <td class="num">${expected}</td>
          <td class="num">${actual !== null ? actual : "—"}</td>
          <td class="num ${diff > 0 ? "pos" : diff < 0 ? "neg" : ""}">${actual !== null ? (diff > 0 ? "+" + diff : diff) : "—"}</td>
          <td class="num">${amountText}</td>
        </tr>
      `;
    }).join("");

    document.getElementById("kpiGrid").innerHTML = `
      <div class="kpi-card">
        <div class="kpi-title">Тооллогын явц</div>
        <div class="kpi-val">${countedItems} / ${totalItems} (${pct}%)</div>
        <div class="kpi-sub">Нийт хамрагдсан мөр</div>
      </div>
      <div class="kpi-card dashed">
        <div class="kpi-title">Баталгаажсан дүн (CFO)</div>
        <div class="kpi-val">${verifiedAmount.toLocaleString("mn-MN")} ₮</div>
        <div class="kpi-sub">${unverifiedCount > 0 ? unverifiedCount + " мөр өртөггүй (зохиомол дүнгүй)" : "Бүх мөр баталгаатай өртөгтэй"}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Илүүдэл (Тоо ширхэг)</div>
        <div class="kpi-val pos">+${surplusQty}</div>
        <div class="kpi-sub">BC хүлээгдэж буйгаас илүү</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-title">Дутагдал (Тоо ширхэг)</div>
        <div class="kpi-val neg">-${shortageQty}</div>
        <div class="kpi-sub">BC хүлээгдэж буйгаас дутуу</div>
      </div>
    `;

    // Бүсээрх ахиц
    const sites = ["Power", "Mining", "CAMP", "UB"];
    document.getElementById("siteChart").innerHTML = sites.map(s => {
      const sItems = INITIAL_CATALOG.filter(i => i.site === s && (modFilter === "ALL" || i.type === modFilter));
      const sCounted = sItems.filter(i => state.counts[i.id] !== undefined).length;
      const sPct = sItems.length ? Math.round((sCounted / sItems.length) * 100) : 0;
      return `
        <div class="bar-row">
          <div class="bar-label"><span>${s}</span><span>${sCounted}/${sItems.length} (${sPct}%)</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${sPct}%"></div></div>
        </div>
      `;
    }).join("");

    // Өдрийн тренд (жишээ өгөгдөл + өнөөдрийн бодит тоо)
    const todayTotal = Object.keys(state.counts).length;
    const trend = [
      { day: "11/24", val: 42 },
      { day: "11/25", val: 68 },
      { day: "11/26", val: 85 },
      { day: "11/27", val: 94 },
      { day: "11/28 (Өнөөдөр)", val: Math.min(100, pct || todayTotal * 15) }
    ];
    document.getElementById("trendChart").innerHTML = trend.map(t => `
      <div class="bar-row">
        <div class="bar-label"><span>${t.day}</span><span>${t.val}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${t.val}%;background:var(--success)"></div></div>
      </div>
    `).join("");

    document.getElementById("varianceTableBody").innerHTML = rowsHtml;
  }

  // Event Listeners
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.activeTab = btn.dataset.tab;
      clearSelection();
      applyRolePermissions();
      persist();
      renderItems();
      renderExecReport();
    });
  });

  document.getElementById("roleSelect").addEventListener("change", (e) => {
    state.role = e.target.value;
    clearSelection();
    applyRolePermissions();
    persist();
    renderItems();
    renderExecReport();
  });

  document.getElementById("siteSelect").addEventListener("change", (e) => {
    state.site = e.target.value;
    clearSelection();
    applyRolePermissions();
    persist();
    renderItems();
    renderExecReport();
  });

  document.getElementById("searchInput").addEventListener("input", renderItems);
  document.getElementById("clearSearchBtn").addEventListener("click", () => {
    document.getElementById("searchInput").value = "";
    renderItems();
    document.getElementById("searchInput").focus();
  });

  document.getElementById("deselectBtn").addEventListener("click", clearSelection);
  document.getElementById("reportModuleFilter").addEventListener("change", renderExecReport);

  document.getElementById("qrSimBtn").addEventListener("click", () => {
    const moduleType = state.activeTab === "assets" ? "FA" : "INV";
    const candidate = INITIAL_CATALOG.find(i => i.type === moduleType);
    if (candidate) {
      selectItem(candidate.id);
      showToast(`QR уншигдлаа: ${candidate.id}`);
    }
  });

  document.getElementById("networkToggle").addEventListener("click", () => {
    state.online = !state.online;
    if (state.online && state.syncQueue.length > 0) {
      const synced = state.syncQueue.length;
      state.syncQueue = [];
      showToast(`Онлайн боллоо: ${synced} мөр давхаргүй синк хийгдлээ.`);
    } else {
      showToast(state.online ? "Онлайн горимд шилжлээ." : "Офлайн горимд шилжлээ.");
    }
    persist();
  });

  // Эхлүүлэх
  document.getElementById("roleSelect").value = state.role;
  document.getElementById("siteSelect").value = state.site;
  applyRolePermissions();
  updateHeaderStatus();
  renderItems();
  renderExecReport();
</script>
</body>
</html>
